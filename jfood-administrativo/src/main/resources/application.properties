spring.application.name=jfood-administrativo
server.port=8080

# O banco e o mesmo container da Aula 2
spring.datasource.url=jdbc:postgresql://localhost:5432/jfood-db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# NUNCA use update ou create-drop em producao -- a Aula 4 resolve isso com Flyway.
# Aqui e validate porque o esquema foi criado a mao na Etapa 2 e queremos a conferencia.
spring.jpa.hibernate.ddl-auto=validate

# Fecha a sessao no fim do servico, e nao no fim da requisicao. Sem isso, o lazy
# loading continua funcionando na camada web e o N+1 fica invisivel.
spring.jpa.open-in-view=false

# Estatisticas do Hibernate: e por elas que a Etapa 3 conta as queries de cada
# endpoint. Em producao ficam desligadas -- medir custa.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
