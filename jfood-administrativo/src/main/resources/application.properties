spring.application.name=jfood-administrativo
server.port=8080

# O banco e o mesmo container da Aula 2
spring.datasource.url=jdbc:postgresql://localhost:5432/jfood-db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# O esquema agora tem um dono so: o Flyway. O Hibernate nao toca nele.
# (validate tambem seria defensavel em desenvolvimento, como conferencia dupla.)
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true

# Producao: o clean apaga o esquema inteiro. Esta linha bloqueia a operacao,
# independentemente de quem a dispare.
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true

# Fecha a sessao no fim do servico, e nao no fim da requisicao. Sem isso, o lazy
# loading continua funcionando na camada web e o N+1 fica invisivel.
spring.jpa.open-in-view=false

# Estatisticas do Hibernate: e por elas que a Etapa 3 conta as queries de cada
# endpoint. Em producao ficam desligadas -- medir custa.
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG
