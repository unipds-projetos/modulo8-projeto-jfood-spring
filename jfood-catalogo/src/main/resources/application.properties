spring.application.name=jfood-catalogo
server.port=8082

# O banco jfood_catalogo e criado no primeiro insert.
#
# authSource=admin e obrigatorio: o usuario admin foi criado no banco admin
# (pelo MONGO_INITDB_ROOT_*), e nao em jfood_catalogo. Sem ele, a autenticacao
# falha.
#
# ATENCAO -- mudou no Spring Boot 4: a propriedade e spring.mongodb.uri.
# A antiga, spring.data.mongodb.uri (que a apostila usa), esta DEPRECADA e nao
# aplica mais as credenciais: a aplicacao sobe e so quebra na primeira operacao,
# com "Command createIndexes requires authentication".
spring.mongodb.uri=mongodb://admin:adminpassword@localhost:27017/jfood_catalogo?authSource=admin

# Os indices sao criados por migracao explicita (MongoIndexInitializer), e nao
# pelo auto-index-creation. O porque esta em docs/aula08.md.
spring.data.mongodb.auto-index-creation=false

# Para ver as consultas no console
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# -----------------------------------------------------------------------------
# Aula 9 — cache em Redis
# -----------------------------------------------------------------------------
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Trava o provedor de cache em Redis. Sem isto, se o Redis falhar, o Spring pode
# cair em silencio para um cache em memoria local (ConcurrentHashMap): cada
# instancia passa a ter o proprio cache incoerente, e NINGUEM e avisado.
spring.cache.type=redis

# TTL do cache de destaques -- curto de proposito, para o experimento de stampede
jfood.cache.destaques-ttl=60s
jfood.cache.destaques-jitter=15s
