spring.application.name=jfood-tracking
server.port=8083

spring.cassandra.keyspace-name=jfood_tracking
spring.cassandra.contact-points=127.0.0.1
spring.cassandra.port=9042

# O driver EXIGE que voce declare o datacenter local quando informa contact
# points -- e uma protecao contra rotear trafego para outra regiao sem querer.
# Sem esta linha:
#   IllegalStateException: Since you provided explicit contact points, the local
#   DC must be explicitly set. Current DCs in this cluster are: datacenter1
# Descubra o valor com: SELECT cluster_name, data_center FROM system.local;
spring.cassandra.local-datacenter=datacenter1

# NONE: o esquema pertence ao cql/01-keyspace-e-tabelas.cql, e nao ao Spring.
# CREATE_IF_NOT_EXISTS geraria tabelas a partir das anotacoes -- e as decisoes
# que importam aqui (bucketing, clustering order, TTL) nao cabem em anotacao.
spring.cassandra.schema-action=NONE

# O timeout padrao de 2 s e curto para lote grande no teste de carga
spring.cassandra.request.timeout=10s
